<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160">
  <defs>
    <radialGradient id="tok-gloss" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tok-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <g>
    <!-- Cheap static contact shadow (no SVG filter, so it stays smooth while the
         pawn animates on low-powered devices). -->
    <ellipse cx="52" cy="150" rx="30" ry="8" fill="#000000" opacity="0.28"/>
    <path
      d="M15,148 C5,146 6,118 9,95 C13,54 26,24 50,24 C74,24 87,54 91,95 C94,118 95,146 85,148 C70,156 30,156 15,148 Z"
      fill="var(--fill-colour)" stroke="#00000055" stroke-width="2.5"/>
    <path
      d="M15,148 C5,146 6,118 9,95 C13,54 26,24 50,24 C74,24 87,54 91,95 C94,118 95,146 85,148 C70,156 30,156 15,148 Z"
      fill="url(#tok-shade)"/>
    <ellipse cx="40" cy="60" rx="26" ry="34" fill="url(#tok-gloss)"/>
    <!-- eyes -->
    <ellipse cx="37" cy="92" rx="11" ry="13" fill="#ffffff"/>
    <ellipse cx="63" cy="92" rx="11" ry="13" fill="#ffffff"/>
    <circle cx="39" cy="95" r="5.5" fill="#1b1b1b"/>
    <circle cx="61" cy="95" r="5.5" fill="#1b1b1b"/>
    <circle cx="41" cy="93" r="1.8" fill="#ffffff"/>
    <circle cx="63" cy="93" r="1.8" fill="#ffffff"/>
  </g>
</svg>
